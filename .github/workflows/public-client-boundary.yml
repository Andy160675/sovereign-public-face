name: Public client boundary

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # Reading the private receipt engine from GitHub Packages.
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.4.1 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
        env:
          # Read access to the private receipt engine. GITHUB_TOKEN suffices
          # only once this repository is granted read access to that package;
          # otherwise set a JARUS_REGISTRY_TOKEN secret with read:packages.
          JARUS_REGISTRY_TOKEN: ${{ secrets.JARUS_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: pnpm test

      - name: Build production bundle
        if: always()
        run: pnpm build

      - name: Verify production bundle boundary
        if: always()
        run: pnpm run verify:public-bundle
